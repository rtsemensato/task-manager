@if (!auth.isInitializing()) {
  <div class="shell">
    <header class="topbar">
      <a class="brand" routerLink="/tasks">Task Manager</a>
      @if (auth.isAuthenticated()) {
        <div class="topbar-user">
          <span class="user-email">{{ auth.currentUser()?.email }}</span>
          <button type="button" class="btn-ghost" (click)="logout()">Sair</button>
        </div>
      }
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
} @else {
  <div class="boot-loading">Carregando…</div>
}
